  <!-- PHOTO WALL + HERO + EXPLORE all share ONE pinned field canvas, so the background is
       continuous (two canvases meant two independent shaders and a visible seam between them) -->
  <div class="field-wrap">
    <div class="field-bg" aria-hidden="true"><canvas id="field-canvas"></canvas></div>

  <!-- INTRO — each word is its own span and lands as the surfer (below) clears it; the exact
       per-word timing is computed from her path in initSurferIntro() (app.js). -->
  <div class="intro-row">
    <p class="carousel-intro"><span>Hi,</span> <span>I'm</span> <span>Ella</span></p>
  </div>

  <!-- SURFER — rides a hooked path (right along the text line, then a clockwise sweep down and
       back left) and lands in the photo box, where she spins twice and hands over to the
       graduation photo mid-spin. The path itself is measured and built in initSurferIntro(). -->
  <div class="surfer-fly" aria-hidden="true">
    <!-- the spin lives on its own element: putting `rotate` on the same node as `offset-path`
         composes the two transforms and swings her around the wrong origin mid-turn -->
    <div class="surfer-spin">
      <!-- eager + high priority: her ride starts the moment the page loads and plays only once,
           so a lazy load could mean the visitor misses it entirely -->
      <img class="surfer" src="assets/surfer.png?v=3" alt="" loading="eager" fetchpriority="high">
    </div>
  </div>

  <!-- ABOUT ME — runs on the landing timeline, after the surfer has left the screen: the photo
       slides into place first, then the line types itself out. No .reveal class here — these are
       time-driven, not scroll-driven, so the two systems don't fight over opacity. -->
  <section class="about-me">
    <p class="about-me-label" aria-label="And this is me">And this is me</p>
    <figure class="about-me-photo">
      <img src="assets/about-me.jpg" alt="Ella on her graduation day" loading="eager">
    </figure>
  </section>

  <!-- CAROUSEL — an interactive 3D curved carousel: images sit on a cylinder you drag / swipe
       (or arrow-key) to rotate; it snaps to the nearest card. No text. Sits ON the moving field.
       Cards are placed on the ring + interaction wired up in initCarousel() (app.js). -->
  <section class="carousel" aria-label="Selected work and process">
    <div class="carousel-stage" id="carousel-stage" tabindex="0" role="group"
         aria-roledescription="carousel" aria-label="Photos — drag or use arrow keys to rotate">
      <div class="carousel-ring" id="carousel-ring"></div>
    </div>
    <p class="carousel-hint" aria-hidden="true">Drag to explore ↔</p>
  </section>

  <!-- HERO -->
  <section class="hero"></section>
