      <!-- exact hues of the shader field (pal()); only lightness is lowered, so they stay the
           same teal/violet/sky but sit a step darker than the background -->
      <radialGradient id="fg-teal" cx="35%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#9EE6DB"/><stop offset="45%" stop-color="#5FDDCA"/>
        <stop offset="100%" stop-color="#22C3AB"/>
      </radialGradient>
      <radialGradient id="fg-violet" cx="35%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#B8ADF5"/><stop offset="45%" stop-color="#806CEF"/>
        <stop offset="100%" stop-color="#3E20E9"/>
      </radialGradient>
      <radialGradient id="fg-azure" cx="35%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#7FC8F8"/><stop offset="45%" stop-color="#4DB3F7"/>
        <stop offset="100%" stop-color="#0B95F2"/>
      </radialGradient>
      <!-- the same flower as a reusable CSS clip-path — not currently applied anywhere
           (the intro used to clip a photo to it before the pixel character replaced that
           photo), kept here in case a future flower-shaped image wants it. objectBoundingBox
           wants 0–1 coords while #flower-path is drawn 0–100, hence the scale(0.01). Whatever
           box uses it must be SQUARE or the petals stretch. -->
      <clipPath id="flower-clip" clipPathUnits="objectBoundingBox">
        <use href="#flower-path" transform="scale(0.01)"/>
      </clipPath>
    </defs>

  <header class="site-header">

    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>

         markup for now — the CSS rule/animation and the SVG assets (assets/about/shell-*)

  <!-- LANDING — just the animated shader field behind the greeting, the hobby list and the
       "check out my work" teaser. Everything else (About detail, shell nav, carousel) now
       lives further down in .about-field, outside this wrap, so the interactive field only
       covers the actual landing view. -->
  <div class="field-wrap">
    <div class="field-bg" aria-hidden="true"><canvas id="field-canvas"></canvas></div>

  <div class="intro-row">
    <div class="intro-hero">
      <p class="carousel-intro">
        <span class="intro-word">Hi,</span> <span class="intro-word">I'm</span> <span class="intro-word">Ella</span>
      </p>
      <!-- the polaroid now sits right next to "Ella" (DOM order drives flex layout
           order — it's listed second, the character third). Spins in (see
           intro-photo-spin-in, style.css) right as the character vanishes, t=3.7s. -->
      <div class="intro-me">
        <!-- bare photo, no polaroid card/caption — see .intro-me-photo, style.css -->
        <figure class="intro-me-photo">
          <img src="assets/hikerme.jpg" alt="A photo of Ella hiking">
        </figure>
      </div>
      <!-- pixel-art character, now sitting on the FAR right (where the polaroid used to
           be) — mirrored (scaleX(-1) on the <img>, see .intro-character img) to face
           left, toward "Ella"/the polaroid, since that's the direction she now throws
           in. Three separate GIFs chained by initCharacterSequence() (app.js) — GIFs
           can't be spliced with CSS, so it swaps the <img> src on a timer instead:
           falling.gif (9 frames, t=0-2.3s — the last frame, a wave, is patched to hold
           0.7s instead of 0.2s so it reads for longer) → rotating.gif (2 frames,
           t=2.3-2.7s, turns her to profile) → pokemon-ball-throw.gif (5 frames,
           t=2.7-3.7s — a supplied "catch" clip played in reverse, so the ball leaves
           her hand and flies off instead of arriving in it), then settles on the
           static character-south.png. CSS layers two transforms on top:
           character-fall-in (drops her from above the page over the same 1.8s the
           falling.gif's actual fall motion takes — she's landed well before the
           wave-hold finishes) and character-vanish — once she's thrown, she fades out
           and is removed from the flex row entirely (t=3.7-4.3s). -->
      <div class="intro-character" aria-hidden="true">
        <img src="assets/character-falling.gif" alt="" loading="eager" fetchpriority="high">
      </div>
    </div>
    <!-- sits below the centred greeting+character row, not inline with it, so it can
         run its own full-width left-aligned line rather than being squeezed into the
         same shrink-wrapped row (see .intro-hero's max-width:fit-content). -->
    <p class="intro-tagline reveal">and i like to make cool products with a twist</p>
    <!-- MINI CAROUSEL — a smaller version of the big drag-rotate-snap carousel further
         down the page (same mechanic, initCarouselInstance() in app.js), showing PROJECTS
         instead of personal photos, with a caption underneath synced to whichever card
         is front-facing (initMiniCarousel()). Reuses makePoster() so it shows Stride's
         real photo and the same generated poster art used everywhere else — nothing
         fabricated here. Sits centred, unlike the left-aligned text above it. -->
    <div class="carousel mini-carousel">
      <div class="carousel-stage mini-carousel-stage" id="mini-carousel-stage" tabindex="0" role="group"
           aria-roledescription="carousel" aria-label="My work — drag or use arrow keys to rotate">
        <div class="carousel-ring" id="mini-carousel-ring"></div>
      </div>
      <p class="carousel-hint" aria-hidden="true">Drag to explore ↔</p>
      <p class="mini-carousel-caption" id="mini-carousel-caption" aria-live="polite"></p>
      <!-- its shell now lives up in the header nav (see .nav-shell) instead of here. -->
      <p class="find-out-more">find out more below</p>
      <!-- a plain solid royal-blue ellipse (user-supplied reference image, no ring) with a
           thin white border, ringed by two concentric glows: a tighter blue one (the same
           masked radial-gradient recipe + shimmer-on-hover as the header's EGD logo badge,
           .brand/.brand-glow) right around the border, then a wider soft white one beyond
           that — no white backdrop behind it, just the two glows. See .egd-badge,
           style.css. intro-work-bubble is kept purely as the JS hook
           initCharacterSequence() (app.js) uses to time this badge's reveal-in with the
           rest of the intro sequence. -->
      <div class="intro-cta">
        <a class="egd-badge intro-work-bubble" href="work.html" aria-label="Selected Works">
          <span class="egd-badge-glow-white" aria-hidden="true"></span>
          <span class="egd-badge-glow" aria-hidden="true"></span>
          <span class="egd-badge-shape" aria-hidden="true"></span>
          <span class="egd-badge-text">Selected<br>Works</span>
        </a>
      </div>
    </div>
  </div>

  <!-- the hammer's the mini/project carousel's custom drag cursor — same body-level,
       position:fixed pattern as the old surfer-cursor (see initHammerCursor(), app.js),
       so the stage's overflow clip can't cut it off. -->
  <img class="hammer-cursor" src="assets/hammer-cursor.png?v=1" alt="" aria-hidden="true" draggable="false">
